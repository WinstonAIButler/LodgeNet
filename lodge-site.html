<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lodge website</title>
<meta name="description" content="A Masonic lodge's website on LodgeNet: meetings, upcoming events, officers, contact and giving.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/lodge-site.css">
<style>
body{margin:0;background:#fff}
[hidden]{display:none!important}
.state{max-width:520px;margin:90px auto;text-align:center;padding:0 20px;font:16px/1.55 "Public Sans",system-ui,sans-serif;color:#1d2433}
.state h1{font:700 26px/1.2 Montserrat,system-ui,sans-serif;margin:0 0 10px}
.state p{color:#5a6276}
.state a{color:#1c3a75}
</style>
</head>
<body>
<!-- A lodge's public website at /site/<slug>/… (vercel.json rewrites here). assets/lodge-site.js fetches what the lodge
     last published and assets/site-render.js draws it, the same renderer the dashboard's Website builder uses. -->
<div id="state" class="state"><p>Loading the lodge's website…</p></div>
<div id="site" hidden></div>
<script src="/assets/site-render.js"></script>
<script src="/assets/lodge-site.js"></script>
</body>
</html>
